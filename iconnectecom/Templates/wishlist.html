<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f8f9fa;
        }
        .wishlist-item {
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fff;
        }
        .wishlist-img {
            width: 100px;
            border-radius: 8px;
        }
        .price {
            font-size: 20px;
            color: #e74c3c;
            font-weight: 700;
        }
        .old-price {
            color: #888;
            text-decoration: line-through;
            font-size: 16px;
        }
        .save-price {
            color: #27ae60;
            font-weight: 500;
        }
        .btn-add-cart {
            background: #007bff;
            color: #fff;
            border-radius: 8px;
        }
        .btn-remove {
            color: #dc3545;
            border: none;
            background: none;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="#">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Wishlist</li>
            </ol>
        </nav>

        <h2>Wishlist</h2>
        <div class="wishlist-item">
            <div class="row align-items-center">
                <div class="col-2">
                    <img src="13.jpg" alt="iPhone 12" class="wishlist-img">
                </div>
                <div class="col-4">
                    <h5>iPhone 12 64GB Blue</h5>
                    <p>Storage: 64GB | Color: Blue | Condition: Good</p>
                    <p>Battery: Optimal | Works with all networks</p>
                </div>
                <div class="col-2">
                    <p class="price">R4499.90 <span class="old-price">R7719.90</span></p>
                    <p class="save-price">Save R3220.00</p>
                </div>
                <div class="col-4">
                    <button class="btn btn-add-cart me-2"><i class="fa fa-shopping-cart"></i> Add to Cart</button>
                    <button class="btn-remove" onclick="removeItem()"><i class="fa fa-trash"></i> Remove</button>
                </div>
            </div>
        </div>
        <!-- Add more wishlist items as needed -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function removeItem() {
            event.target.closest('.wishlist-item').remove();
        }
    </script>
</body>
</html>
